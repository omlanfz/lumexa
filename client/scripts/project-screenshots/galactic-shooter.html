<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css">
<style>
body{background:#04061a}
svg{position:absolute;inset:0}
.hud{position:absolute;color:#fff;font-weight:800;letter-spacing:.04em;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.panel{background:rgba(10,14,40,.62);border:1px solid rgba(160,180,255,.25);border-radius:14px;backdrop-filter:blur(6px)}
.lb{right:26px;top:84px;width:292px;padding:14px 16px}
.lb h4{font-size:14px;color:#9fb4ff;text-transform:uppercase;letter-spacing:.14em;margin-bottom:10px;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;font-size:16px;color:#e6ebff}
.row b{margin-left:auto;font-variant-numeric:tabular-nums;color:#fff}
.row .av{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:15px}
.row.me{background:linear-gradient(90deg,rgba(124,58,237,.55),rgba(37,99,235,.4));border:1px solid rgba(190,170,255,.55)}
.chat{left:26px;bottom:26px;width:380px;padding:12px 14px;font-size:14px;color:#dbe4ff;line-height:1.55}
.chat span{color:#7dd3fc;font-weight:700}
.menu{left:26px;top:24px;display:flex;gap:10px}
.menu i{color:#fff;width:44px;height:44px;border-radius:12px;background:rgba(10,14,40,.62);border:1px solid rgba(160,180,255,.25);display:grid;place-items:center;font-style:normal;font-size:20px}
.bar{height:16px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden;border:1px solid rgba(255,255,255,.2)}
.bar i{display:block;height:100%;border-radius:9px}
</style></head><body>
<svg width="1280" height="800" viewBox="0 0 1280 800" id="s"></svg>

<div class="menu abs"><i>☰</i><i>💬</i><i>🎒</i></div>
<div class="hud" style="left:50%;top:22px;transform:translateX(-50%);text-align:center">
  <div style="font-size:15px;color:#9fb4ff;letter-spacing:.3em">WAVE 4</div>
  <div style="font-size:50px;line-height:1.05;font-variant-numeric:tabular-nums">12,450</div>
</div>
<div class="hud" style="left:26px;top:84px;width:300px">
  <div style="font-size:13px;color:#9fb4ff;letter-spacing:.2em;margin-bottom:6px">SHIELD</div>
  <div class="bar"><i style="width:72%;background:linear-gradient(90deg,#22d3ee,#3b82f6)"></i></div>
  <div style="font-size:13px;color:#9fb4ff;letter-spacing:.2em;margin:12px 0 6px">POWER</div>
  <div class="bar"><i style="width:46%;background:linear-gradient(90deg,#f59e0b,#ef4444)"></i></div>
</div>
<div class="panel hud lb">
  <h4><span>🏆 Leaderboard</span><span>Wave 4</span></h4>
  <div class="row"><span class="av" style="background:#f59e0b">👩‍🚀</span>NovaStar_09<b>18,920</b></div>
  <div class="row me"><span class="av" style="background:#7c3aed">🧑‍🚀</span>Rafi_A (You)<b>12,450</b></div>
  <div class="row"><span class="av" style="background:#10b981">👾</span>KaiBlaster<b>11,200</b></div>
  <div class="row"><span class="av" style="background:#ef4444">🤖</span>Mimi_Zoom<b>8,740</b></div>
  <div class="row"><span class="av" style="background:#3b82f6">🚀</span>Sakib77<b>6,310</b></div>
</div>
<div class="panel chat abs"><span>[NovaStar_09]</span> that boss wave is wild 😮<br><span>[KaiBlaster]</span> Rafi your shield is glowing!<br><span>[Rafi_A]</span> thanks, I made the laser faster 🔥</div>

<script>
let seed=7;const r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const NS="http://www.w3.org/2000/svg";
const s=document.getElementById("s");
s.innerHTML=`
<defs>
 <radialGradient id="bg" cx="50%" cy="100%" r="110%"><stop offset="0" stop-color="#2b1a6e"/><stop offset=".55" stop-color="#0b0f3a"/><stop offset="1" stop-color="#03051a"/></radialGradient>
 <radialGradient id="neb1" cx="22%" cy="30%" r="40%"><stop offset="0" stop-color="#7c3aed" stop-opacity=".45"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
 <radialGradient id="neb2" cx="75%" cy="55%" r="40%"><stop offset="0" stop-color="#2563eb" stop-opacity=".4"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
 <radialGradient id="planet" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fbbf77"/><stop offset=".5" stop-color="#e0623d"/><stop offset="1" stop-color="#5a1b3d"/></radialGradient>
 <radialGradient id="boom" ><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#fde047"/><stop offset=".6" stop-color="#f97316" stop-opacity=".85"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient>
 <linearGradient id="hull" x1="0" x2="1"><stop offset="0" stop-color="#6366f1"/><stop offset=".5" stop-color="#c7d2fe"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
 <linearGradient id="lz" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1280" height="800" fill="url(#bg)"/><rect width="1280" height="800" fill="url(#neb1)"/><rect width="1280" height="800" fill="url(#neb2)"/>`;
let h="";
for(let i=0;i<220;i++){const x=r()*1280,y=r()*800,rad=.4+r()*1.7;h+=`<circle cx="${x}" cy="${y}" r="${rad}" fill="#fff" opacity="${.25+r()*.7}"/>`}
// planet with ring
h+=`<g transform="translate(1010,640)"><ellipse rx="300" ry="62" fill="none" stroke="#c4b5fd" stroke-opacity=".35" stroke-width="14" transform="rotate(-14)"/><circle r="170" fill="url(#planet)"/><ellipse rx="300" ry="62" fill="none" stroke="#ddd6fe" stroke-opacity=".6" stroke-width="10" transform="rotate(-14)" clip-path="inset(50% 0 0 0)"/></g>`;
// enemies
function enemy(x,y,c,sc=1){return `<g transform="translate(${x},${y}) scale(${sc})" filter="url(#glow)">
 <path d="M-46 8 L-22 -18 L22 -18 L46 8 L28 24 L-28 24 Z" fill="${c}" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>
 <ellipse cy="-4" rx="20" ry="13" fill="#0b0f3a" stroke="#fff" stroke-opacity=".5"/><circle cx="-8" cy="-4" r="4.5" fill="#fde047"/><circle cx="8" cy="-4" r="4.5" fill="#fde047"/>
 <path d="M-46 8 L-62 30 L-34 22 Z M46 8 L62 30 L34 22 Z" fill="${c}" opacity=".85"/></g>`}
const cols=["#ef4444","#f97316","#ec4899"];
[[330,190],[470,160],[610,140],[750,160],[890,190],[400,290],[540,270],[680,270],[820,290]].forEach(([x,y],i)=>{h+=enemy(x,y,cols[i%3],.9)});
// explosion
h+=`<circle cx="610" cy="360" r="70" fill="url(#boom)" filter="url(#glow)"/><circle cx="610" cy="360" r="30" fill="#fff" opacity=".9"/>`;
for(let i=0;i<16;i++){const a=i/16*6.283,d=70+r()*40;h+=`<circle cx="${610+Math.cos(a)*d}" cy="${360+Math.sin(a)*d}" r="${2+r()*4}" fill="#fde047"/>`}
// lasers
[[560,700,600,380],[610,700,610,380],[660,700,625,380]].forEach(([x1,y1,x2,y2])=>{h+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="url(#lz)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>`});
h+=`<line x1="470" y1="640" x2="470" y2="230" stroke="url(#lz)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/><line x1="750" y1="640" x2="750" y2="230" stroke="url(#lz)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>`;
// enemy shots
[[330,300],[890,330]].forEach(([x,y])=>{h+=`<circle cx="${x}" cy="${y}" r="9" fill="#fb7185" filter="url(#glow)"/><circle cx="${x}" cy="${y}" r="4" fill="#fff"/>`});
// player ship
h+=`<g transform="translate(610,715)" filter="url(#glow)">
 <ellipse cy="46" rx="16" ry="34" fill="#38bdf8" opacity=".6"/><ellipse cy="40" rx="8" ry="22" fill="#fff" opacity=".8"/>
 <path d="M0 -58 L22 -8 L74 34 L74 50 L26 34 L16 52 L-16 52 L-26 34 L-74 50 L-74 34 L-22 -8 Z" fill="url(#hull)" stroke="#fff" stroke-width="2"/>
 <path d="M0 -42 L11 -4 L0 6 L-11 -4 Z" fill="#0b0f3a"/><path d="M0 -36 L6 -6 L-6 -6 Z" fill="#22d3ee"/>
 <circle cx="-48" cy="38" r="5" fill="#f472b6"/><circle cx="48" cy="38" r="5" fill="#f472b6"/></g>`;
s.insertAdjacentHTML("beforeend",h);
</script></body></html>
