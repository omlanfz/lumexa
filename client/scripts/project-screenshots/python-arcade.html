<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css">
<style>
body{background:#10131f}
.win{background:#0e1220}
.game{position:relative;flex:1;overflow:hidden;image-rendering:pixelated}
.hud{position:absolute;top:18px;font-family:"JetBrains Mono",monospace;font-weight:800;color:#fff;font-size:26px;letter-spacing:.06em;text-shadow:3px 3px 0 #000}
.px{position:absolute;image-rendering:pixelated}
.e{position:absolute;font-size:64px;line-height:1;filter:drop-shadow(4px 4px 0 rgba(0,0,0,.35))}
.pwr{position:absolute;right:22px;bottom:22px;font-family:"JetBrains Mono",monospace;font-size:15px;color:#fff;background:rgba(0,0,0,.45);padding:9px 14px;border-radius:6px;line-height:1.7;border:2px solid rgba(255,255,255,.3)}
</style></head><body>
<div class="win">
 <div class="bar"><div class="dots"><i></i><i></i><i></i></div><span style="margin:0 auto" class="mono">pygame window — Fox Runner</span><span style="width:50px"></span></div>
 <div class="game" id="g">
  <canvas id="c" width="1280" height="762" style="position:absolute;inset:0"></canvas>
  <div class="hud" style="left:28px">SCORE 004820</div>
  <div class="hud" style="left:50%;transform:translateX(-50%);color:#fde047">❤ ❤ ❤</div>
  <div class="hud" style="right:28px">HI 012900</div>
  <div class="e" style="left:250px;top:468px;font-size:78px">🦊</div>
  <div class="e" style="left:700px;top:476px">👾</div>
  <div class="e" style="left:980px;top:300px;font-size:52px">🪙</div>
  <div class="e" style="left:880px;top:238px;font-size:52px">🪙</div>
  <div class="e" style="left:1080px;top:238px;font-size:52px">🪙</div>
  <div class="e" style="left:440px;top:210px;font-size:52px">🪙</div>
  <div class="e" style="left:520px;top:180px;font-size:52px">🪙</div>
  <div class="e" style="left:600px;top:210px;font-size:52px">🪙</div>
  <div class="e" style="left:1150px;top:478px">🌵</div>
  <div class="pwr">⚡ POWER-UP: DOUBLE JUMP<br>x2 COIN BONUS · 00:08</div>
 </div>
</div>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");
let seed=3;const r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
// sky
let g=x.createLinearGradient(0,0,0,762);g.addColorStop(0,"#5aa9ff");g.addColorStop(.6,"#a8d8ff");g.addColorStop(1,"#ffe3b3");x.fillStyle=g;x.fillRect(0,0,1280,762);
// sun
x.fillStyle="#fff2a8";x.beginPath();x.arc(1030,150,70,0,7);x.fill();
// clouds (blocky)
function cloud(cx,cy,s){x.fillStyle="rgba(255,255,255,.95)";[[0,0,120,34],[28,-24,70,30],[-10,12,150,26]].forEach(([a,b,w,h])=>{x.fillRect(cx+a*s,cy+b*s,w*s,h*s)})}
cloud(160,120,1.3);cloud(560,80,1);cloud(870,200,.9);cloud(1180,90,1.1);
// far hills
function hills(base,col,amp,f,ph){x.fillStyle=col;x.beginPath();x.moveTo(0,762);for(let i=0;i<=1280;i+=8){x.lineTo(i,base-Math.abs(Math.sin(i/f+ph))*amp)}x.lineTo(1280,762);x.fill()}
hills(560,"#7fc4a0",90,140,0);hills(600,"#4fa37a",70,95,2);
// blocky pixel trees
for(let i=0;i<9;i++){const tx=40+i*150+r()*40,ty=560;x.fillStyle="#6b4226";x.fillRect(tx,ty,14,36);x.fillStyle="#2f8f4e";x.fillRect(tx-22,ty-34,58,38);x.fillRect(tx-10,ty-62,34,30)}
// ground
x.fillStyle="#58b848";x.fillRect(0,600,1280,28);
x.fillStyle="#8a5a34";x.fillRect(0,628,1280,134);
for(let i=0;i<64;i++){x.fillStyle=i%2?"#7a4d2b":"#9a6a40";x.fillRect(i*20,628+((i*37)%5)*22,20,20)}
x.fillStyle="#3f9a32";for(let i=0;i<64;i++){x.fillRect(i*20,600,12,10)}
// floating platforms
function plat(px,py,w){for(let i=0;i<w;i++){x.fillStyle="#58b848";x.fillRect(px+i*40,py,40,14);x.fillStyle="#8a5a34";x.fillRect(px+i*40,py+14,40,26);x.fillStyle="rgba(0,0,0,.18)";x.fillRect(px+i*40,py+14,40,6)}}
plat(420,300,5);plat(850,330,4);
// shadow under fox
x.fillStyle="rgba(0,0,0,.2)";x.beginPath();x.ellipse(288,622,40,8,0,0,7);x.fill();
</script>
</body></html>
